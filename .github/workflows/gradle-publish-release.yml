name: Publish Release
on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release to Maven
    runs-on: ubuntu-latest
    environment: Publish Environment

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven
        run: ./gradlew publish --no-daemon --stacktrace
        env:
          SPACE_USERNAME: ${{ vars.SPACE_USERNAME }}
          SPACE_PASSWORD: ${{ secrets.SPACE_PASSWORD }}
