ktor {
  deployment {
    port: 2626
    port = ${?PORT}
  }
  application {
    modules = [
      org.jetbrains.kastle.server.CompressionKt.compression
      org.jetbrains.kastle.server.LoggingKt.logging
      org.jetbrains.kastle.server.GeneratorKt.provideGenerator
      org.jetbrains.kastle.server.AnalyticsKt.configureAnalytics
      org.jetbrains.kastle.server.JsonKt.json
      org.jetbrains.kastle.server.RoutingKt.routing
      org.jetbrains.kastle.server.SerializationKt.serialization
      org.jetbrains.kastle.server.MonitoringKt.monitoring
      org.jetbrains.kastle.server.ErrorHandlingKt.errorHandling
    ]
  }
}

repository {
  source = ../repository-intellij
  dir = ../export
  dir = ${?REPOSITORY_PATH}
}

analytics {
  # Set to true to enable analytics tracking
  enabled = false
  enabled = ${?ANALYTICS_ENABLED}

  # Fully qualified class name of AnalyticsRepository implementation
  # Example: org.jetbrains.kastle.analytics.fus.FusAnalyticsRepository
  implementation = ${?ANALYTICS_IMPLEMENTATION}
}

frontEnd {
  # for example: /generator
  basePath = ""
  basePath = ${?BASE_PATH}

  # Google Tag Manager ID (e.g. GTM-XXXXXX). Only rendered when set.
  googleTagManagerId = ${?GOOGLE_TAG_MANAGER_ID}
}
