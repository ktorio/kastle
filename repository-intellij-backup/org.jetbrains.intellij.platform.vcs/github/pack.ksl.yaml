name: GitHub
description: Generates GitHub workflows useful for plugin development (build and verification, releasing, UI tests, Dependabot).
icon: AllIcons.Vcs.Vendors.Github
requires:
  - org.jetbrains.intellij.platform.vcs/git

rootSources:
  - path: .github/dependabot.yml
  - path: .github/workflows/build.yml.hbs
    target: file://.github/workflows/build.yml
  - path: .github/workflows/release.yml
  - path: .github/workflows/run-ui-tests.yml
