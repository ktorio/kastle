name: Compose UI
description: An open-source, declarative framework for building stunning UIs
icon: AllIcons.FileTypes.UiForm
links:
  home: https://www.jetbrains.com/compose-multiplatform
  guide: https://www.jetbrains.com/help/kotlin-multiplatform-dev/compose-multiplatform.html

propertyValues:
  - key: org.jetbrains.intellij.platform/plugin/isComposeEnabled
    value: true

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: composeUI()
    priority: 10
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>com.intellij.modules.compose</depends>
    priority: 10
