name: Java
description: JVM Platform APIs for Java, Kotlin, Groovy and Scala
icon: AllIcons.FileTypes.Java
links:
  home: https://plugins.jetbrains.com/plugin/27368-java

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("com.intellij.java")
    priority: 30
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>com.intellij.java</depends>
    priority: 30

  # Modular plugin

  ## Shared
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedBuildScriptDependencies
    #language=kotlin
    text: |
      bundledModule("intellij.java.frontback.psi")
      bundledModule("intellij.java.frontback.impl")
    priority: 30
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.java.frontback.psi"/>
      <module name="intellij.java.frontback.impl"/>
    priority: 30

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: |
