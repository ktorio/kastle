name: JavaScript and TypeScript
description: JavaScript, TypeScript, JSX and TSX files
icon: AllIcons.FileTypes.JavaScript
links:
  home: https://plugins.jetbrains.com/plugin/22069-javascript-and-typescript

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("JavaScript")
    priority: 50
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>JavaScript</depends>
    priority: 50

  # Modular plugin

  ## Shared
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedBuildScriptDependencies
    #language=kotlin
    text: bundledModule("intellij.javascript.common")
    priority: 50
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedModuleDescriptorDependencies
    #language=xml
    text: <module name="intellij.javascript.common"/>
    priority: 50

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: bundledModule("intellij.javascript.common")
    priority: 50
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: <module name="intellij.javascript.common"/>
    priority: 50

  ## Frontend
  - target: slot://org.jetbrains.intellij.platform/plugin/frontendBuildScriptDependencies
    #language=kotlin
    text: bundledModule("intellij.javascript.frontend")
    priority: 50
  - target: slot://org.jetbrains.intellij.platform/plugin/frontendModuleDescriptorDependencies
    #language=xml
    text: <module name="intellij.javascript.frontend"/>
    priority: 50
