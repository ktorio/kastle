name: JSON
description: Dependency on the JSON (com.intellij.modules.json) plugin
icon: AllIcons.FileTypes.Json
links:
  home: https://plugins.jetbrains.com/plugin/25364-json

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("com.intellij.modules.json")
    priority: 60
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>com.intellij.modules.json</depends>
    priority: 60

  # Modular plugin

  ## Shared
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedBuildScriptDependencies
    #language=kotlin
    text: bundledModule("intellij.json")
    priority: 60
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedModuleDescriptorDependencies
    #language=xml
    text: <module name="intellij.json"/>
    priority: 60

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: |
      bundledModule("intellij.json")
      bundledModule("intellij.json.backend")
      bundledModule("intellij.json.backend.regexp")
      bundledModule("intellij.json.syntax")
    priority: 60
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.json"/>
      <module name="intellij.json.backend"/>
      <module name="intellij.json.backend.regexp"/>
      <module name="intellij.json.syntax"/>
    priority: 60
