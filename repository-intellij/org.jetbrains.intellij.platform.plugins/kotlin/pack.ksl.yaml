name: Kotlin
description: Kotlin plugin
icon: AllIcons.Language.Kotlin
links:
  home: https://plugins.jetbrains.com/plugin/6954-kotlin

propertyValues:
  - key: org.jetbrains.intellij.platform/plugin/isKotlinEnabled
    value: true

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("org.jetbrains.kotlin")
    priority: 40
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>org.jetbrains.kotlin</depends>
    priority: 40
  - target: slot://org.jetbrains.intellij.platform/plugin/customPluginDescriptorExtensions
    #language=xml
    text: |-
      <extensions defaultExtensionNs="org.jetbrains.kotlin">
          <supportsKotlinPluginMode supportsK2="true" />
      </extensions>

  # Modular plugin

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: bundledPlugin("org.jetbrains.kotlin")
    priority: 40
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: <plugin id="org.jetbrains.kotlin"/>
    priority: 40

  ## Frontend
  - target: slot://org.jetbrains.intellij.platform/plugin/frontendBuildScriptDependencies
    #language=kotlin
    text: bundledPlugin("org.jetbrains.kotlin")
    priority: 40
  - target: slot://org.jetbrains.intellij.platform/plugin/frontendModuleDescriptorDependencies
    #language=xml
    text: <plugin id="com.intellij.kotlin.frontend"/>
    priority: 40
