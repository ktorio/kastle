name: Markdown
description: Markdown language and preview UI
icon: AllIcons.FileTypes.Text
links:
  home: https://plugins.jetbrains.com/plugin/7793-markdown

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("org.intellij.plugins.markdown")
    priority: 100
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>org.intellij.plugins.markdown</depends>
    priority: 100

  # Modular plugin

  ## Shared
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedBuildScriptDependencies
    #language=kotlin
    text: bundledModule("intellij.markdown")
    priority: 100
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedModuleDescriptorDependencies
    #language=xml
    text: <module name="intellij.markdown"/>
    priority: 100

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: |
      bundledModule("intellij.markdown")
      bundledModule("intellij.markdown.fenceInjection")
      bundledModule("intellij.markdown.frontmatter")
      bundledModule("intellij.markdown.frontmatter.yaml")
      bundledModule("intellij.markdown.frontmatter.toml")
      bundledModule("intellij.markdown.images")
      bundledModule("intellij.markdown.xml")
      bundledModule("intellij.markdown.model")
      bundledModule("intellij.markdown.spellchecker")
      bundledModule("intellij.markdown.compose.preview")
      bundledModule("intellij.markdown.backend")
    priority: 100
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.markdown"/>
      <module name="intellij.markdown.fenceInjection"/>
      <module name="intellij.markdown.frontmatter"/>
      <module name="intellij.markdown.frontmatter.yaml"/>
      <module name="intellij.markdown.frontmatter.toml"/>
      <module name="intellij.markdown.images"/>
      <module name="intellij.markdown.xml"/>
      <module name="intellij.markdown.model"/>
      <module name="intellij.markdown.spellchecker"/>
      <module name="intellij.markdown.compose.preview"/>
      <module name="intellij.markdown.backend"/>
    priority: 100
