name: Properties
description: Properties files
icon: AllIcons.FileTypes.Properties
links:
  home: https://plugins.jetbrains.com/plugin/11594-properties

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: bundledPlugin("com.intellij.properties")
    priority: 90
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>com.intellij.properties</depends>
    priority: 90

  # Modular plugin

  ## Shared
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedBuildScriptDependencies
    #language=kotlin
    text: |
      bundledModule("intellij.properties")
      bundledModule("intellij.properties.psi")
    priority: 90
  - target: slot://org.jetbrains.intellij.platform/plugin/sharedModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.properties"/>
      <module name="intellij.properties.psi"/>
    priority: 90

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: |
      bundledModule("intellij.properties.copyright")
      bundledModule("intellij.properties.backend.psi")
      bundledModule("intellij.properties.backend")
      bundledModule("intellij.properties")
      bundledModule("intellij.properties.psi")
    priority: 90
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.properties.copyright"/>
      <module name="intellij.properties.backend.psi"/>
      <module name="intellij.properties.backend"/>
      <module name="intellij.properties"/>
      <module name="intellij.properties.psi"/>
    priority: 90
