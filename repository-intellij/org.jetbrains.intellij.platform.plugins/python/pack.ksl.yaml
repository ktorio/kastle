name: Python
description: Python language
icon: AllIcons.Language.Python
links:
  home: https://plugins.jetbrains.com/plugin/7322-python-community-edition

commonSources:
  # Classic plugin
  - target: slot://org.jetbrains.intellij.platform/plugin/buildScriptDependencies
    #language=kotlin
    text: compatiblePlugin("PythonCore")
  - target: slot://org.jetbrains.intellij.platform/plugin/pluginDescriptorDepends
    #language=xml
    text: <depends>PythonCore</depends>

  # Modular plugin

  ## Backend
  - target: slot://org.jetbrains.intellij.platform/plugin/backendBuildScriptDependencies
    #language=kotlin
    text: compatiblePlugin("PythonCore")
  - target: slot://org.jetbrains.intellij.platform/plugin/backendModuleDescriptorDependencies
    #language=xml
    text: |
      <module name="intellij.python.psi"/>
      <module name="intellij.python.psi.impl"/>
