name: GitHub
description: Generates GitHub Actions workflows for CI/CD and dependency management.
icon: AllIcons.Nodes.FolderGithub
links:
  home: https://github.com/

propertyValues:
  - key: org.jetbrains.intellij.platform/plugin/isGithubEnabled
    value: "true"
  - key: org.jetbrains.intellij.platform.misc/qodana/isGithubEnabled
    value: "true"

rootSources:
  - path: .github/workflows/build.yml.hbs
    target: file:.github/workflows/build.yml
  - path: .github/workflows/release.yml
  - path: .github/dependabot.yml
  - path: .github/ISSUE_TEMPLATE/bug-report.yml
  - path: .github/ISSUE_TEMPLATE/feature-request.yml
  - path: githubConnectSection.hbs
    target: slot://org.jetbrains.intellij.platform/plugin/readmeInitialSections
  - path: githubReadmeSection.hbs
    target: slot://org.jetbrains.intellij.platform/plugin/readmeAdditionalSections
