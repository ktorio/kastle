platform: jvm

sources:
  # Gradle build script
  - path: build.gradle.kts
    target: file:build.gradle.kts
    if: "!isModularEnabled"
  - path: gradle.properties.hbs
    target: file:gradle.properties
    if: "!isModularEnabled"
  - path: settings.gradle.kts
    target: file:settings.gradle.kts
    if: "!isModularEnabled"

  # README and friends
  - path: README.md.hbs
    target: file:README.md
    if: "!isModularEnabled"

  # Git
  - path: gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "!isModularEnabled"

  # Production sources

  ## Plugin descriptor, etc.
  - path: src/main/resources/META-INF/plugin.xml.hbs
    target: file:src/main/resources/META-INF/plugin.xml
    if: "!isModularEnabled"
  - path: src/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg
    if: "!isModularEnabled"

  ## Code samples
  - path: src/main/kotlin/MyMessageBundle.kt
    target: file:src/main/kotlin/MyMessageBundle.kt
    if: "!isModularEnabled && addSampleCode"
  - path: src/main/resources/messages/MyMessageBundle.properties
    target: file:src/main/resources/messages/MyMessageBundle.properties
    if: "!isModularEnabled && addSampleCode"

  ### Swing UI
  - path: src/main/kotlin/MyToolWindowFactory.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: "!isModularEnabled && addSampleCode && !isComposeEnabled"

  ### Compose UI
  - path: src/main/kotlin/MyToolWindowFactory-compose.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: "!isModularEnabled && addSampleCode && isComposeEnabled"
