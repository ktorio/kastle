platform: jvm

if: isModularEnabled

sources:
  - path: build.gradle-template.kts
    target: file:../../backend/build.gradle.kts

  - path: sources/main/resources/modular.plugin.backend.xml.hbs
    target: file:../../backend/src/main/resources/${pluginModuleName}.backend.xml

  ### Code samples
  - path: sources/main/kotlin/*
    target: file:../../backend/src/main/kotlin
    if: addSampleCode

  - path: sources/main/resources/messages/ModularPluginBackendBundle.properties
    target: file:../../backend/src/main/resources/messages/ModularPluginBackendBundle.properties
    if: addSampleCode
