platform: jvm

sources:

  # Gradle build script
  - path: build.gradle.kts
    target: file:build.gradle.kts
    if: isModularEnabled
  - path: gradle.properties.hbs
    target: file:gradle.properties
    if: isModularEnabled
  - path: settings.gradle.kts
    target: file:settings.gradle.kts
    if: isModularEnabled

  # README
  - path: README.md
    target: file:README.md
    if: isModularEnabled

  # Plugin descriptor
  - path: sources/main/resources/META-INF/plugin.xml
    target: file:src/main/resources/META-INF/plugin.xml
    if: isModularEnabled
  - path: sources/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg
    if: isModularEnabled

  ## Shared module
  - path: shared/build.gradle.kts
    target: file:shared/build.gradle.kts
    if: isModularEnabled
  - path: shared/src/main/resources/modular.plugin.shared.xml
    target: file:shared/src/main/resources/modular.plugin.shared.xml
    if: isModularEnabled

  ### Shared code samples
