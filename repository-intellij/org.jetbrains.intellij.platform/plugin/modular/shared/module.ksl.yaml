platform: jvm

sources:
  - path: build.gradle.kts
    target: file:../../shared/build.gradle.kts
    if: isModularEnabled

  - path: sources/main/resources/modular.plugin.shared.xml
    target: file:../../shared/src/main/resources/modular.plugin.shared.xml
    if: isModularEnabled

  ### Code samples
  - path: sources/main/kotlin/*
    target: file:../../shared/src/main/kotlin
    if: isModularEnabled && addSampleCode

  - path: sources/main/resources/messages/ModularPluginSharedBundle.properties
    target: file:../../shared/src/main/resources/messages/ModularPluginSharedBundle.properties
    if: isModularEnabled && addSampleCode
