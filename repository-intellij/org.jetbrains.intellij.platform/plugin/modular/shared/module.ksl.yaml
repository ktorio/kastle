platform: jvm

sources:
  - path: build.gradle.kts
    if: isModularEnabled

  - path: sources/main/resources/modular.plugin.shared.xml
    target: file:src/main/resources/modular.plugin.shared.xml
    if: isModularEnabled

  ### Code samples
  - path: sources/main/kotlin/ChatMessage.kt
    target: file:src/main/kotlin/ChatMessage.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/kotlin/ChatRepositoryRpcApi.kt
    target: file:src/main/kotlin/ChatRepositoryRpcApi.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/kotlin/ModularPluginSharedBundle.kt
    target: file:src/main/kotlin/ModularPluginSharedBundle.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/kotlin/Searchable.kt
    target: file:src/main/kotlin/Searchable.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/kotlin/dtos.kt
    target: file:src/main/kotlin/dtos.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/kotlin/serializers.kt
    target: file:src/main/kotlin/serializers.kt
    if: isModularEnabled && addSampleCode
  - path: sources/main/resources/messages/ModularPluginSharedBundle.properties
    target: file:src/main/resources/messages/ModularPluginSharedBundle.properties
    if: isModularEnabled && addSampleCode
