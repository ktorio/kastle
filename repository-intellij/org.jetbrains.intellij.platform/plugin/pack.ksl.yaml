name: IDE Plugin
description: IntelliJ Platform plugin project

properties:
  - key: addSampleCode
    type: boolean
    default: false
    label: Add Sample Code
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: isComposeEnabled
    type: boolean
    default: false
    hidden: true
  - key: isModularEnabled
    type: boolean
    default: false
    hidden: true
  # Values are managed in propertyValues below:
  - key: gradlePluginVersion
    type: string
    hidden: true
  - key: platformVersion
    type: string
    hidden: true
  - key: pluginSinceBuild
    type: string
    hidden: true
  - key: gradleVersion
    type: string
    hidden: true
  - key: pluginName
    type: string
    hidden: true

propertyValues:
  # Common versions management:
  - key: org.jetbrains.intellij.platform/plugin/gradlePluginVersion
    value: "2.13.1"
  - key: org.jetbrains.intellij.platform/plugin/platformVersion
    value: "2025.3.1"
  - key: org.jetbrains.intellij.platform/plugin/pluginSinceBuild
    value: "253"
  - key: org.jetbrains.intellij.platform/plugin/gradleVersion
    value: "9.2.1"

  # Post-processed input properties:
  - key: pluginName
    expression: _project.name.capitalize()

rootSources:

  # =========== Common =================== #

  # Run configurations
  - path: .run/Run Plugin.run.xml

  # Gradle
  - path: gradle/libs.versions.toml.hbs
    target: file:gradle/libs.versions.toml
  - path: gradle/wrapper/gradle-wrapper.jar
  - path: gradle/wrapper/gradle-wrapper.properties.hbs
    target: file:gradle/wrapper/gradle-wrapper.properties
  - path: gradlew
  - path: gradlew.bat

  # =========== Classic Plugin =========== #

  # Gradle build script
  - path: classic/build.gradle.kts
    target: file:build.gradle.kts
    if: "!isModularEnabled"
  - path: classic/gradle.properties.hbs
    target: file:gradle.properties
    if: "!isModularEnabled"
  - path: classic/settings.gradle.kts
    target: file:settings.gradle.kts
    if: "!isModularEnabled"

  # README and friends
  - path: classic/README.md.hbs
    target: file:README.md
    if: "!isModularEnabled"

  # Git
  - path: classic/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "!isModularEnabled"

  # Production sources

  ## Plugin descriptor, etc.
  - path: classic/src/main/resources/META-INF/plugin.xml.hbs
    target: file:src/main/resources/META-INF/plugin.xml
    if: "!isModularEnabled"
  - path: classic/src/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg
    if: "!isModularEnabled"

  ## Code samples
  - path: classic/src/main/kotlin/MyMessageBundle.kt
    target: file:src/main/kotlin/MyMessageBundle.kt
    if: "!isModularEnabled && addSampleCode"
  - path: classic/src/main/resources/messages/MyMessageBundle.properties
    target: file:src/main/resources/messages/MyMessageBundle.properties
    if: "!isModularEnabled && addSampleCode"

  ### Swing UI
  - path: classic/src/main/kotlin/MyToolWindowFactory.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: "!isModularEnabled && addSampleCode && !isComposeEnabled"

  ### Compose UI
  - path: classic/src/main/kotlin/MyToolWindowFactory-compose.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: "!isModularEnabled && addSampleCode && isComposeEnabled"

  # =========== Modular Plugin =========== #

  # Gradle build script
  - path: modular/build.gradle.kts
    target: file:build.gradle.kts
    if: isModularEnabled
  - path: modular/gradle.properties.hbs
    target: file:gradle.properties
    if: isModularEnabled
  - path: modular/settings.gradle.kts
    target: file:settings.gradle.kts
    if: isModularEnabled

  # README
  - path: modular/README.md
    target: file:README.md
    if: isModularEnabled

  # Plugin descriptor
  - path: modular/src/main/resources/META-INF/plugin.xml
    target: file:src/main/resources/META-INF/plugin.xml
    if: isModularEnabled
  - path: modular/src/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg
    if: isModularEnabled

  ## Shared module
  - path: modular/shared/build.gradle.kts
    target: file:shared/build.gradle.kts
    if: isModularEnabled
  - path: modular/shared/src/main/resources/modular.plugin.shared.xml
    target: file:shared/src/main/resources/modular.plugin.shared.xml
    if: isModularEnabled

  ### Shared code samples
  - path: modular/shared/src/main/kotlin/ChatMessage.kt
    target: file:shared/src/main/kotlin/ChatMessage.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/kotlin/ChatRepositoryRpcApi.kt
    target: file:shared/src/main/kotlin/ChatRepositoryRpcApi.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/kotlin/ModularPluginSharedBundle.kt
    target: file:shared/src/main/kotlin/ModularPluginSharedBundle.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/kotlin/Searchable.kt
    target: file:shared/src/main/kotlin/Searchable.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/kotlin/dtos.kt
    target: file:shared/src/main/kotlin/dtos.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/kotlin/serializers.kt
    target: file:shared/src/main/kotlin/serializers.kt
    if: isModularEnabled && addSampleCode
  - path: modular/shared/src/main/resources/messages/ModularPluginSharedBundle.properties
    target: file:shared/src/main/resources/messages/ModularPluginSharedBundle.properties
    if: isModularEnabled && addSampleCode

  ## Backend module
  - path: modular/backend/build.gradle.kts
    target: file:backend/build.gradle.kts
    if: isModularEnabled
  - path: modular/backend/src/main/resources/modular.plugin.backend.xml
    target: file:backend/src/main/resources/modular.plugin.backend.xml
    if: isModularEnabled
    
  ### Backedn code samples
  - path: modular/backend/src/main/kotlin/BackendChatRepositoryModel.kt
    target: file:backend/src/main/kotlin/BackendChatRepositoryModel.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/kotlin/BackendChatRepositoryRpcApi.kt
    target: file:backend/src/main/kotlin/BackendChatRepositoryRpcApi.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/kotlin/BackendRpcApiProvider.kt
    target: file:backend/src/main/kotlin/BackendRpcApiProvider.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/kotlin/ModularPluginBackendBundle.kt
    target: file:backend/src/main/kotlin/ModularPluginBackendBundle.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/kotlin/repository/AIResponseGenerator.kt
    target: file:backend/src/main/kotlin/repository/AIResponseGenerator.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/kotlin/repository/ChatMessageFactory.kt
    target: file:backend/src/main/kotlin/repository/ChatMessageFactory.kt
    if: isModularEnabled && addSampleCode
  - path: modular/backend/src/main/resources/messages/ModularPluginBackendBundle.properties
    target: file:backend/src/main/resources/messages/ModularPluginBackendBundle.properties
    if: isModularEnabled && addSampleCode

  ## Frontend module
  - path: modular/frontend/build.gradle.kts
    target: file:frontend/build.gradle.kts
    if: isModularEnabled
  - path: modular/frontend/src/main/resources/modular.plugin.frontend.xml
    target: file:frontend/src/main/resources/modular.plugin.frontend.xml
    if: isModularEnabled
    
  ### Frontend code samples
