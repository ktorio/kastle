name: IDE Plugin
description: IntelliJ Platform plugin project

properties:
  - key: addSampleCode
    type: boolean
    default: false
    label: Add Sample Code
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: isKotlinEnabled
    type: boolean
    default: false
    hidden: true
  - key: isModularEnabled
    type: boolean
    default: false
    hidden: true
  - key: pluginName
    type: string
    hidden: true
  - key: pluginModuleName
    type: string
    hidden: true
  - key: isGithubEnabled
    type: boolean
    default: false
    hidden: true

  # Fixed values:
  - key: platformVersion
    type: string
    hidden: true
    default: "2025.3.5"
  - key: platformVersionModular
    type: string
    hidden: true
    default: "2026.1.3"
  - key: intellijPlatformGradlePluginVersion
    type: string
    hidden: true
    default: "2.17.0"

propertyValues:
  # Post-processed input properties:
  - key: pluginName
    expression: _project.name.capitalize()
  - key: pluginModuleName
    expression: toPluginModuleName(_project.name)

rootSources:

  # Files common for classic and modular plugins

  # CHANGELOG
  - path: CHANGELOG.md.hbs
    target: file:CHANGELOG.md

  # Gradle
  - path: gradle/libs.versions.toml.hbs
    target: file:gradle/libs.versions.toml
  - path: gradle/wrapper/gradle-wrapper.jar
  - path: gradle/wrapper/gradle-wrapper.properties.hbs
    target: file:gradle/wrapper/gradle-wrapper.properties
  - path: gradlew
  - path: gradlew.bat

  # Git (because slots can't be targeted from module sources)
  - path: classic/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "!isModularEnabled"
  - path: modular/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "isModularEnabled"
