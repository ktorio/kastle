name: IDE Plugin
description: IntelliJ Platform plugin project

properties:
  - key: addSampleCode
    type: boolean
    default: false
    label: Add Sample Code
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: isComposeEnabled
    type: boolean
    default: false
    hidden: true
  - key: isKotlinEnabled
    type: boolean
    default: false
    hidden: true
  - key: isModularEnabled
    type: boolean
    default: false
    hidden: true
  - key: pluginName
    type: string
    hidden: true
  # Values are managed in propertyValues below:
  - key: gradlePluginVersion
    type: string
    hidden: true
  - key: platformVersion
    type: string
    hidden: true

propertyValues:
  # Common versions management:
  - key: org.jetbrains.intellij.platform/plugin/gradlePluginVersion
    value: "2.13.1"
  - key: org.jetbrains.intellij.platform/plugin/platformVersion
    value: "2025.3.4.1"

  # Post-processed input properties:
  - key: pluginName
    expression: _project.name.capitalize()

rootSources:

  # Files common for classic and modular plugins

  # Run configurations
  - path: .run/Run Plugin.run.xml
  - path: .run/Run Tests.run.xml
  - path: .run/Run Verifications.run.xml

  # Gradle
  - path: gradle/libs.versions.toml.hbs
    target: file:gradle/libs.versions.toml
  - path: gradle/wrapper/gradle-wrapper.jar
  - path: gradle/wrapper/gradle-wrapper.properties.hbs
    target: file:gradle/wrapper/gradle-wrapper.properties
  - path: gradlew
  - path: gradlew.bat

  # Git (because slots can't be targeted from module sources)
  - path: classic/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "!isModularEnabled"
  - path: modular/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
    if: "isModularEnabled"
