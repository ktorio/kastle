name: IDE Plugin
description: IntelliJ Platform plugin project

properties:
  - key: pluginName
    label: Plugin Name
    type: string
  - key: addSampleCode
    type: boolean
    default: true
    label: Add Sample Code
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: isComposeEnabled
    type: boolean
    default: false
    hidden: true

  # Constants for easier versions management:
  - key: gradleVersion
    type: string
    default: "9.2.1"
    hidden: true
  - key: platformVersion
    type: string
    default: "2025.3.1"
    hidden: true
  - key: pluginSinceBuild
    type: string
    default: "253"
    hidden: true

propertyValues:
  org.jetbrains.intellij.platform/plugin/pluginName: My Plugin # TODO: expression

rootSources:
  # Run configurations
  - path: .run/Run Plugin.run.xml

  # Gradle
  - path: gradle/libs.versions.toml.hbs
    target: file:gradle/libs.versions.toml
  - path: gradle/wrapper/gradle-wrapper.jar
  - path: gradle/wrapper/gradle-wrapper.properties.hbs
    target: file:gradle/wrapper/gradle-wrapper.properties
  - path: gradlew
  - path: gradlew.bat

  # Gradle build script
  - path: build.gradle.kts
  - path: gradle.properties.hbs
    target: file:gradle.properties
  - path: settings.gradle.kts

  # README and friends
  - path: README.md.hbs
    target: file:README.md

  # Git
  - path: gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems

  # Sources are intentionally in the `sources` directory to avoid being processed by module.ksl.yaml handler

  # Production sources

  ## Plugin descriptor, etc.
  - path: sources/main/resources/META-INF/plugin.xml.hbs
    target: file:src/main/resources/META-INF/plugin.xml
  - path: sources/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg

  ## Code samples
  - path: sources/main/kotlin/MyMessageBundle.kt
    target: file:src/main/kotlin/MyMessageBundle.kt
    if: addSampleCode
  - path: sources/main/resources/messages/MyMessageBundle.properties
    target: file:src/main/resources/messages/MyMessageBundle.properties
    if: addSampleCode

  ### Swing UI
  - path: sources/main/kotlin/MyToolWindowFactory.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: addSampleCode && !isComposeEnabled

  ### Compose UI
  - path: sources/main/kotlin/MyToolWindowFactory-compose.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: addSampleCode && isComposeEnabled
