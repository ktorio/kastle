name: IDE Plugin
description: IntelliJ Platform plugin project

properties:
  - key: addSampleCode
    type: boolean
    default: false
    label: Add Sample Code
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: isComposeEnabled
    type: boolean
    default: false
    hidden: true
  - key: pluginName
    type: string
    hidden: true
  # Values are managed in propertyValues below:
  - key: platformVersion
    type: string
    hidden: true

propertyValues:
  # Common versions management:
  - key: org.jetbrains.intellij.platform/plugin/platformVersion
    value: "2025.2.6.1"

  # Post-processed input properties:
  - key: pluginName
    expression: _project.name.capitalize()

rootSources:
  # Run configurations
  - path: .run/Run Plugin.run.xml

  # Gradle
  - path: gradle/libs.versions.toml.hbs
    target: file:gradle/libs.versions.toml
  - path: gradle/wrapper/gradle-wrapper.jar
  - path: gradle/wrapper/gradle-wrapper.properties.hbs
    target: file:gradle/wrapper/gradle-wrapper.properties
  - path: gradlew
  - path: gradlew.bat

  # Gradle build script
  - path: classic/build.gradle-template.kts
    target: file:build.gradle.kts
  - path: classic/gradle.properties.hbs
    target: file:gradle.properties
  - path: classic/settings.gradle.kts
    target: file:settings.gradle.kts

  # README and friends
  - path: classic/CHANGELOG.md.hbs
    target: file:CHANGELOG.md
  - path: classic/README.md.hbs
    target: file:README.md

  # Git
  - path: classic/gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems

  # Production sources

  ## Plugin descriptor, etc.
  - path: classic/src/main/resources/META-INF/plugin.xml.hbs
    target: file:src/main/resources/META-INF/plugin.xml
  - path: classic/src/main/resources/META-INF/pluginIcon.svg
    target: file:src/main/resources/META-INF/pluginIcon.svg

  ## Code samples
  - path: classic/src/main/kotlin/MyMessageBundle.kt
    target: file:src/main/kotlin/MyMessageBundle.kt
    if: addSampleCode
  - path: classic/src/main/resources/messages/MyMessageBundle.properties
    target: file:src/main/resources/messages/MyMessageBundle.properties
    if: addSampleCode

  ### Swing UI
  - path: classic/src/main/kotlin/MyToolWindowFactory.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: addSampleCode && !isComposeEnabled

  ### Compose UI
  - path: classic/src/main/kotlin/MyToolWindowFactory-compose.kt
    target: file:src/main/kotlin/MyToolWindowFactory.kt
    if: addSampleCode && isComposeEnabled
