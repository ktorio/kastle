name: IDE Theme
description: IntelliJ Platform theme project

properties:
  - key: hiddenInWizard
    type: boolean
    default: true
    hidden: true
  - key: pluginName
    type: string
    hidden: true
  - key: themeProviderId
    type: string
    hidden: true

propertyValues:
  # Post-processed input properties:
  - key: pluginName
    expression: _project.name.capitalize()
  - key: themeProviderId
    expression: uuid()

rootSources:
  # Sources are intentionally in the `sources` directory to avoid being processed by module.ksl.yaml handler

  # Production sources
  - path: sources/resources/META-INF/plugin.xml.hbs
    target: file:resources/META-INF/plugin.xml
  - path: sources/resources/META-INF/pluginIcon.svg
    target: file:resources/META-INF/pluginIcon.svg
  - path: sources/resources/theme/mytheme.theme.json.hbs
    target: file:resources/theme/mytheme.theme.json

  # Git
  - path: gitignoreItems.hbs
    target: slot://org.jetbrains.intellij.platform.vcs/git/ignoredItems
