platform: ios

dependencies:
  - ../shared
  - $compose.ui

gradle:
  plugins:
    - compose.multiplatform
    - compose.compiler
    - compose.hotReload

amper:
  compose: enabled

sources:
  - target: slot://org.gradle/gradle/iosOverride
    text: |-
      listOf(
          iosArm64(),
          iosSimulatorArm64()
      ).forEach { iosTarget ->
          iosTarget.binaries.framework {
              baseName = "ComposeApp"
              isStatic = true
          }
      }