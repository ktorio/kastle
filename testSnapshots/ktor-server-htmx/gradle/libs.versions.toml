[versions]
kotlin = "2.3.20-Beta2"
ktor = "3.4.1"
logback = "1.5.21"

[libraries]
htmx-html = { module = "io.ktor:ktor-htmx-html", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
server-htmlBuilder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
server-htmx = { module = "io.ktor:ktor-server-htmx", version.ref = "ktor" }
server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
