kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true

# Path to the Kastle pack repository, relative to this build's root directory.
# The Kastle Gradle plugin reads pack manifests from this directory and registers
# each module as a Gradle subproject, which makes them visible to the IDE with
# full source/code-completion support.
kastle.repositoryPath=repository
# Where the kslRunExport goes to
kastle.exportPath=../export
