platform: android

dependencies:
  - ../shared
  - $libs.androidx.activity.compose
  - $libs.compose.uiToolingPreview
  - $libs.compose.uiTooling!debugImplementation

toolchain:
  compose: enabled

gradle:
  plugins:
    - $libs.plugins.androidApplication
    - $libs.plugins.composeMultiplatform
    - $libs.plugins.composeCompiler

sources:
  - path: android.gradle.kts
    target: slot://org.gradle/gradle/buildRoot
  - target: slot://org.gradle/gradle/kotlinRoot
    text: |-
      compilerOptions {
          jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
      }
