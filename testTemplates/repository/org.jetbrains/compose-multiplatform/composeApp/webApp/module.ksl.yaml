platform: web

dependencies:
  - ../shared
  - $libs.compose.ui

gradle:
  plugins:
    - $libs.plugins.kotlinMultiplatform
    - $libs.plugins.composeMultiplatform
    - $libs.plugins.composeCompiler

amper:
  compose: enabled

propertyValues:
  - key: org.gradle/gradle/isExecutable
    value: true
